name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Pack compiled assets
        run: zip -r -X build.zip build
        working-directory: public

      - name: Deploy to flipswitch.in
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Add the DEPLOY_TOKEN repository secret, then re-run this job."
            exit 1
          fi
          url="${DEPLOY_URL:-https://flipswitch.in/deploy-hook.php}"
          curl --fail-with-body -sS -m 300 \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -F "build=@public/build.zip" \
            "$url"
